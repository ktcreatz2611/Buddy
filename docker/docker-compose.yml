services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: buddy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy_dev
      POSTGRES_DB: buddy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buddy-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
